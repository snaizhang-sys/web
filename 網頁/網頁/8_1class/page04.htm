<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>文字格式</title>
	</head>

	<body>
		<h2>文字格式</h2>
		<!-- 註解 ctrl+/ -->

		<p>一般文字</p>
		<!-- 老師說這是舊的作法以後不要用 -->
		<p><b>一般文字 粗體</b></p>
		<p><strong>一般文字 重要</strong></p>
		<!-- 老師說這是舊的作法以後不要用 -->
		<p><i>一般文字 斜體</i></p>
		<p><em>一般文字 強調</em></p>
		<!-- 老師說這個很少用 -->
		<p><mark>一般文字 標記 mark</mark></p>
		<p><small>一般文字 縮小 small</small></p>
		<p><del>一般文字 刪除 del</del></p>
		<p><ins>一般文字 底線 ins</ins></p>
		<p>一般文字<sub>下標</sub></p>
		<p>一般文字<sup>上標</sup></p>
		

		<p><a href="../index.html">目錄</a></p>

	</body>
</html>
