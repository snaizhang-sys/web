<script>
	// Example starter JavaScript for disabling form submissions if there are invalid fields
(() => {
  'use strict'

  // Fetch all the forms we want to apply custom Bootstrap validation styles to
  const forms = document.querySelectorAll('.needs-validation')

  // Loop over them and prevent submission
  Array.from(forms).forEach(form => {
    form.addEventListener('submit', event => {
      if (!form.checkValidity()) {
        event.preventDefault()
        event.stopPropagation()
      }

      form.classList.add('was-validated')
    }, false)
  })
})()

</script>

<div class="input-group mt-3">
  <span class="input-group-text">輸入密碼</span>
  <!-- 將 type 從 text 改為 password，並加上 id 以便抓取 -->
  <!-- <input type="password" class="form-control" id="passwordInput" aria-label="輸入密碼"> -->
  <button class="btn btn-outline-secondary" type="button" id="toggleButton">
    <i class="fi fi-ss-eye" id="toggleIcon"></i>
  </button>
</div>

<script>
  // 1. 密碼顯示/隱藏切換
  const passwordInput = document.getElementById('passwordInput');
  const toggleIcon = document.getElementById('toggleIcon');

  document.getElementById('toggleButton').addEventListener('click', function () {
    const isPassword = passwordInput.type === 'password';
    passwordInput.type = isPassword ? 'text' : 'password';
    
    toggleIcon.classList.toggle('fi-ss-eye');
    toggleIcon.classList.toggle('fi-ss-eye-crossed');
  });

  // 2. 按鈕 Loading 狀態
  const submitBtn = document.getElementById('submitBtn');
  const btnText = submitBtn.querySelector('.btn-text');
  const loadingSpinner = document.getElementById('loadingSpinner');

  submitBtn.addEventListener('click', function (e) {
    e.preventDefault(); // 防止表單送出導致頁面重整
    this.disabled = true;
    
    btnText.textContent = 'Loading...';
    loadingSpinner.classList.remove('d-none');
    
    setTimeout(() => {
      this.disabled = false;
      btnText.textContent = 'Sign in';
      loadingSpinner.classList.add('d-none');
    }, 2000);
  });
</script>
