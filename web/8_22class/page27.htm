<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汽車工坊 - 專業服務</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 導覽列 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">SUPER CAR</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#home">首頁</a></li>
                    <li class="nav-item"><a class="nav-link" href="#services">服務項目</a></li>
                    <li class="nav-item"><a class="nav-link" href="#about">關於我們</a></li>
                    <li class="nav-item"><a class="nav-link" href="#contact">聯絡預約</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 首頁輪播圖 (Carousel) -->
    <header id="home">
        <div id="heroCarousel" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-inner">
                <!-- 第一張本地圖片 -->
                <div class="carousel-item active">
                    <img src="img/car1.jpg" class="d-block w-100 hero-img" alt="跑車展示 1">
                    <div class="carousel-caption">
                        <h2 class="display-4 fw-bold">極致性能</h2>
                    </div>
                </div>
                <!-- 第二張本地圖片 -->
                <div class="carousel-item">
                    <img src="img/car2.jpg" class="d-block w-100 hero-img" alt="跑車展示 2">
                    <div class="carousel-caption">
                        <h2 class="display-4 fw-bold">工藝美學</h2>
                    </div>
                </div>
                <!-- 第三張本地圖片 -->
                <div class="carousel-item">
                    <img src="img/car3.jpg" class="d-block w-100 hero-img" alt="跑車展示 3">
                    <div class="carousel-caption">
                        <h2 class="display-4 fw-bold">未來科技</h2>
                    </div>
                </div>
            </div>
            <!-- 左右切換按鈕 -->
            <button class="carousel-control-prev" type="button" data-bs-target="#heroCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#heroCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>
        </div>
    </header>

    <!-- 服務項目 -->
    <section id="services" class="container py-5">
        <div class="text-center mb-5">
            <h2 class="fw-bold">專業服務</h2>
            <hr class="mx-auto" style="width: 50px; border: 2px solid #0d6efd;">
        </div>
        <div class="row g-4">
            <div class="col-md-4">
                <div class="card h-100 shadow-sm border-0">
                    <div class="card-body text-center p-4">
                        <h4 class="card-title">引擎調教</h4>
                        <p class="card-text text-muted">優化動力輸出，提升駕駛樂趣。</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card h-100 shadow-sm border-0">
                    <div class="card-body text-center p-4">
                        <h4 class="card-title">定期保養</h4>
                        <p class="card-text text-muted">嚴謹的檢測流程，守護您的安全。</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card h-100 shadow-sm border-0">
                    <div class="card-body text-center p-4">
                        <h4 class="card-title">車體美容</h4>
                        <p class="card-text text-muted">頂級鍍膜技術，讓愛車長保如新。</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 關於我們 -->
    <section id="about" class="bg-light py-5">
        <div class="container py-4">
            <div class="row align-items-center">
                <div class="col-md-6 mb-4 mb-md-0">
                    <!-- 本地關於我們圖片 -->
                    <img src="img/about_us.jpg" class="img-fluid rounded shadow" alt="關於我們">
                </div>
                <div class="col-md-6 ps-md-5">
                    <h2 class="fw-bold mb-4">關於極致車庫</h2>
                    <p class="text-muted">我們擁有超過 20 年的修車經驗，致力於提供最透明、最專業的車輛維護服務。不論是日常保養還是深度改裝，我們都能滿足您的需求。</p>
                    <button class="btn btn-primary mt-3">了解更多</button>
                </div>
            </div>
        </div>
    </section>

    <!-- 聯絡表單 -->
    <section id="contact" class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <h2 class="text-center fw-bold mb-4">聯絡預約</h2>
                <form id="contactForm">
                    <div class="mb-3">
                        <label class="form-label">姓名</label>
                        <input type="text" class="form-control" placeholder="請輸入姓名" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">電話</label>
                        <input type="tel" class="form-control" placeholder="請輸入聯絡電話" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">訊息內容</label>
                        <textarea class="form-control" rows="4" placeholder="請告訴我們您的需求"></textarea>
                    </div>
                    <button type="submit" class="btn btn-dark w-100 py-2">送出預約</button>
                </form>
            </div>
        </div>
    </section>

    <footer class="bg-dark text-white text-center py-4">
        <p class="mb-0">&copy; 2024 SUPER CAR. All rights reserved.</p>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
