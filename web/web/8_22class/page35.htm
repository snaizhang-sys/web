<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap 響應式網頁 - 自動輪播版</title>
    <!-- 引入 Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* 1. 確保 Carousel 圖片 100% 展延並填滿 */
        .carousel-item img {
            height: 60vh;      /* 設定輪播圖高度 */
            width: 100%;       /* 強制寬度 100% */
            object-fit: cover; /* 解決圖片變形與展延問題 */
            object-position: center;
        }

        /* 2. 卡片圖片統一高度 */
        .card-img-top {
            height: 220px;
            object-fit: cover;
        }

        /* 手機版微調高度 */
        @media (max-width: 768px) {
            .carousel-item img {
                height: 40vh;
            }
        }
    </style>
</head>
<body>

    <!-- 導航欄 (Navbar) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">
                <img src="https://getbootstrap.com/docs/5.3/assets/brand/bootstrap-logo.svg" alt="Logo" width="30" height="24" class="d-inline-block align-text-top me-2">
                BrandLogo
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#">服務項目</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">最新動態</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">聯絡我們</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 輪播圖 (Carousel) - 加入 Autoplay (data-bs-ride="carousel") 與 Crossfade -->
    <!-- data-bs-interval="3000" 設定每 3 秒自動切換 -->
    <div id="mainCarousel" class="carousel slide carousel-fade" data-bs-ride="carousel" data-bs-interval="3000">
        <div class="carousel-inner">
            <!-- 第 1 張圖 -->
            <div class="carousel-item active">
                <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1600&q=80" class="d-block w-100" alt="Slide 1">
                <div class="carousel-caption d-none d-md-block">
                    <h5>探索深谷</h5>
                    <p>專業的自然攝影視角。</p>
                </div>
            </div>
            <!-- 第 2 張圖 (已更新網址確保顯示) -->
            <div class="carousel-item">
                <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=1600&q=80" class="d-block w-100" alt="Slide 2">
                <div class="carousel-caption d-none d-md-block">
                    <h5>迷霧森林</h5>
                    <p>感受大自然的呼吸與靜謐。</p>
                </div>
            </div>
            <!-- 第 3 張圖 -->
            <div class="carousel-item">
                <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1600&q=80" class="d-block w-100" alt="Slide 3">
                <div class="carousel-caption d-none d-md-block">
                    <h5>陽光林道</h5>
                    <p>在光影交織中尋找靈感。</p>
                </div>
            </div>
        </div>
        <!-- 左右控制鍵 -->
        <button class="carousel-control-prev" type="button" data-bs-target="#mainCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#mainCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>
    </div>

    <!-- 卡片區域 (Cards) -->
    <div class="container my-5">
        <div class="row g-4">
            <div class="col-md-4">
                <div class="card h-100 shadow-sm">
                    <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=600&q=80" class="card-img-top" alt="Card 1">
                    <div class="card-body">
                        <h5 class="card-title">網頁開發</h5>
                        <p class="card-text">提供原生 JavaScript 與 Bootstrap 的完美實作方案。</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card h-100 shadow-sm">
                    <img src="https://images.unsplash.com/photo-1504384308090-c894fdcc538d?auto=format&fit=crop&w=600&q=80" class="card-img-top" alt="Card 2">
                    <div class="card-body">
                        <h5 class="card-title">雲端技術</h5>
                        <p class="card-text">高效能的架構設計，滿足各種規模的響應式需求。</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card h-100 shadow-sm">
                    <img src="https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?auto=format&fit=crop&w=600&q=80" class="card-img-top" alt="Card 3">
                    <div class="card-body">
                        <h5 class="card-title">創意設計</h5>
                        <p class="card-text">優雅的介面與流暢的動態效果，提升使用者體驗。</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 引入 Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // 原生 JS 強化：確保輪播在頁面載入後立即啟動
        document.addEventListener('DOMContentLoaded', function() {
            const carouselElement = document.querySelector('#mainCarousel');
            
            // 使用 Bootstrap 實例方法開啟輪播
            const carousel = new bootstrap.Carousel(carouselElement, {
                interval: 3000, // 3000 毫秒切換一次
                ride: 'carousel', // 啟動自動輪播
                pause: 'hover'    // 滑鼠移入時暫停，移開後繼續
            });

            console.log("Carousel Autoplay 已啟動");
        });
    </script>
</body>
</html>
