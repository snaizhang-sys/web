<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汽車工坊 - 基礎範例</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. 導覽列 (Navbar) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="#">汽車工坊</a>
            <!-- 手機版漢堡按鈕 -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#myMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <!-- 導覽連結 -->
            <div class="collapse navbar-collapse" id="myMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#home">首頁</a></li>
                    <li class="nav-item"><a class="nav-link" href="#services">服務</a></li>
                    <li class="nav-item"><a class="nav-link" href="#about">關於</a></li>
                    <li class="nav-item"><a class="nav-link" href="#contact">聯絡</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 2. 首頁輪播圖 (Carousel) - 放入 3 張在地圖片 -->
    <div id="home" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="img/car1.jpg" class="d-block w-100 main-img" alt="車 1">
                <div class="carousel-caption">
                    <h1>頂級跑車</h1>
                </div>
            </div>
            <div class="carousel-item">
                <img src="img/car2.jpg" class="d-block w-100 main-img" alt="車 2">
                <div class="carousel-caption">
                    <h1>專業保養</h1>
                </div>
            </div>
            <div class="carousel-item">
                <img src="img/car3.jpg" class="d-block w-100 main-img" alt="車 3">
                <div class="carousel-caption">
                    <h1>零件升級</h1>
                </div>
            </div>
        </div>
        <!-- 左右控制鈕 -->
        <button class="carousel-control-prev" type="button" data-bs-target="#home" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#home" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>
    </div>

    <!-- 3. 服務項目 (Services) - 三欄式佈局 -->
    <section id="services" class="container py-5">
        <h2 class="text-center mb-4">服務項目</h2>
        <div class="row text-center">
            <div class="col-md-4 mb-3">
                <div class="card p-3 shadow-sm">
                    <h3>快速保養</h3>
                    <p>最專業的技師團隊，給您最快速的服務。</p>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card p-3 shadow-sm">
                    <h3>鈑金噴漆</h3>
                    <p>原廠級漆料，讓您的愛車煥然一新。</p>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card p-3 shadow-sm">
                    <h3>輪胎服務</h3>
                    <p>各國名牌輪胎，保障您的行車安全。</p>
                </div>
            </div>
        </div>
    </section>

    <!-- 4. 關於我們 (About) -->
    <section id="about" class="bg-light py-5">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <img src="img/about.jpg" class="img-fluid rounded" alt="關於我們">
                </div>
                <div class="col-md-6">
                    <h2>關於我們</h2>
                    <p>我們在汽車產業已有 20 年經驗，致力於提供高品質的維修服務。</p>
                </div>
            </div>
        </div>
    </section>

    <!-- 5. 聯絡表單 (Contact) -->
    <section id="contact" class="container py-5">
        <h2 class="text-center mb-4">聯絡我們</h2>
        <form class="mx-auto" style="max-width: 500px;">
            <div class="mb-3">
                <label class="form-label">姓名</label>
                <input type="text" class="form-control" placeholder="請輸入姓名">
            </div>
            <div class="mb-3">
                <label class="form-label">電話</label>
                <input type="tel" class="form-control" placeholder="請輸入電話">
            </div>
            <button type="submit" class="btn btn-primary w-100">送出</button>
        </form>
    </section>

    <!-- 6. 頁尾 -->
    <footer class="bg-dark text-white text-center py-3">
        <p>© 2024 汽車工坊</p>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
