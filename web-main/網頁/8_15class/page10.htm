<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>CSS</title>


		
		<style>
			.text-green {color: green;}
			

			#header {
				background: lightcoral;
				width: 400px;
				height: 60px;
			}

			#menu {
				background: lightblue;
				width: 100px;
				height: 200px;
				float: left;
			}

			#content {
				background: lightcyan;
				width: 300px;
				height: 200px;
				float: left;
			}



			#ad1 {
				background: lightgray;
				width: 100%;
				height: 40px;
			}

			#news {background: lightpink;
				width: 200px;
				height: 160px;
				float: left;
			}

			#ad2 {
				background: lightskyblue;
				width: 100px;
				height: 160px;
				float: left;
			}
			#logo {
			background-image: url('../yahoo.png');
			background-size: contain;
			background-repeat: no-repeat;
			width: 120px;
			height: 40px;
			float: left;
			margin: 10px;



			#ad3 {
				background: lightcoral;
				width: 400px;
				height: 60px;	

			}


		</style>


	</head>

	<body>
		<h2>CSS box modle</h2>

		<div class= "text-green" id="header">
		<div id="logo"></div>
		<div class= "text-green" id="menu">
			<ul>
				<li>新聞</li>
				<li>股市</li>
				<li>運動</li>
				<li>天氣</li>

			</ul>

		</div>
		<div class= "text-green" id="content">
			<div id="ad1">ad1</div>
			<div id="ad2">ad2</div>
			<div id="ad3">ad3</div>

		</div>
		<div></div>
		<div></div>

	
	
		
		
	</body>
</html>
